name: tests

# Full Python test suite on every platform EDR ships for.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile all modules
        run: python -m py_compile share.py relay.py handler.py guard.py print.py doctor_checks.py watch.py qrterm.py command.py error.py
      - name: Unit and end-to-end tests
        shell: bash
        run: |
          set +e
          python tests/ci_runner.py
          code=$?
          tail -n 8 test-output.txt
          if [ "$code" -ne 0 ]; then
            # Surface failures / hangs as an annotation (readable without downloading logs).
            python - <<'PY'
          import os, re
          def read(path):
              return open(path, encoding="utf-8", errors="replace").read().replace("\r", "\n") if os.path.exists(path) else ""
          text, hang = read("test-output.txt"), read("hang-traceback.txt")
          starts = [m.start() for m in re.finditer(r"^(ERROR|FAIL): ", text, re.M)]
          body = text[starts[0]:] if starts else "LAST OUTPUT:\n" + text[-3000:]
          if hang.strip():
              body = "HANG WATCHDOG FIRED\n" + hang[:9000] + "\n\n" + body
          print("::error title=unittest failures::" + body[:20000].replace("%", "%25").replace("\n", "%0A"))
          PY
          fi
          exit $code
